    <title>OmniBlog CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Scrollbar for sleek look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      .notion-editor-content {
        line-height: 1.7;
      }
      .notion-editor-content h1 { font-size: 2em; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; }
      .notion-editor-content h2 { font-size: 1.5em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
      .notion-editor-content h3 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
      .notion-editor-content p { margin-bottom: 1em; }
      .notion-editor-content ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .notion-editor-content ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      .notion-editor-content blockquote { border-left: 4px solid #3b82f6; padding-left: 1em; color: #94a3b8; font-style: italic; }
    </style>
